<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Nebula (Canvas)</title>
<style>body{margin:0;background:#000}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const c=document.getElementById('c'), ctx=c.getContext('2d');
function resize(){c.width=innerWidth; c.height=innerHeight;}
addEventListener('resize',resize); resize();

function rand(x,y){
  return (Math.sin(x*12.9898 + y*78.233) * 43758.5453) % 1;
}
function noise(x,y){
  const xi=Math.floor(x), yi=Math.floor(y);
  const xf=x-xi, yf=y-yi;
  const a=rand(xi,yi), b=rand(xi+1,yi), c2=rand(xi,yi+1), d=rand(xi+1,yi+1);
  const u = xf*xf*(3-2*xf), v=yf*yf*(3-2*yf);
  return a*(1-u)*(1-v) + b*u*(1-v) + c2*(1-u)*v + d*u*v;
}
function fbm(x,y){
  let v=0, amp=0.5, f=1;
  for(let i=0;i<5;i++){
    v += amp * noise(x*f, y*f);
    f *= 2; amp *= 0.5;
  }
  return v;
}

function draw(){
  const img = ctx.createImageData(c.width, c.height);
  const data = img.data;
  for(let y=0;y<c.height;y++){
    for(let x=0;x<c.width;x++){
      const i = (y*c.width + x)*4;
      const n = fbm(x*0.002, y*0.002);
      // color palette (purple-blue)
      const r = Math.pow(n,1.5)*180 + 20;
      const g = Math.pow(n,1.2)*90 + 10;
      const b = Math.pow(n,1.1)*255;
      data[i]=r; data[i+1]=g; data[i+2]=b; data[i+3]=Math.min(255, n*255*1.4);
    }
  }
  ctx.putImageData(img,0,0);
}
draw();
</script>
</body>
</html>
