<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shader Composer</title>
    <link rel="stylesheet" href="style.css?v=2.5">
</head>
<body>
    <canvas id="bg"></canvas>

    <div class="site-logo">Deep Space Mood</div>

    <div class="mode-switcher">
        <button id="basic-mode-btn" class="mode-btn">Basic</button>
        <button id="test-mode-btn" class="mode-btn">Test</button>
    </div>

    <div class="controls">
        <div class="control-group">
            <label for="mood-input">Mood:</label>
            <input type="text" id="mood-input" placeholder="e.g., epic, dreamy, melancholic...">
        </div>

        <div class="control-group test-only">
            <label for="theme-select">Theme:</label>
            <select id="theme-select"></select>
            <button id="theme-toggle-btn">ON</button>
        </div>
        <div class="control-group test-only">
            <label for="saved-styles-select">Saved Styles:</label>
            <select id="saved-styles-select"></select>
        </div>
        
        <div class="control-group button-group" style="align-items: center;">
            <button id="generate-btn">Generate New</button>
            
            <select id="res-select">
                <option value="window">Window Size</option>
                <option value="1280x720">1280x720 (HD)</option>
                <option value="1920x1080" selected>1920x1080 (FHD)</option>
                <option value="1080x1920">1080x1920 (Phone)</option>
            </select>

            <button id="download-jpg-btn">JPG</button>
            <button id="download-webm-btn">WebM (5s)</button>
            
            <button id="save-style-btn" class="test-only">Save Style</button>
            <button id="delete-style-btn" class="test-only">Delete Style</button>
        </div>
    </div>

    <div id="style-info-container" class="test-only">
    </div>

    <div class="copyright-social">
        <span class="watermark">by yomek</span>
        <a href="https://x.com/NikitaLa16831" target="_blank" aria-label="My Twitter">
            <svg class="twitter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c11 3 21-1 21-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"></path>
            </svg>
        </a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="script.js?v=2.5"></script>
</body>
</html>
